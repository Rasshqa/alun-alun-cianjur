    <circle cx="676" cy="2202" r="95" fill="#1E5631" fill-opacity="0.88" stroke="#C59B27" stroke-width="5"/>
    <circle cx="676" cy="2202" r="42" fill="#C59B27" fill-opacity="0.9"/>
