    <!-- Penanda Visual WC / Toilet pada Denah (Sesuai Koordinat Lapangan) -->
    <g transform="translate(1717, 1861)">
      <rect x="-85" y="-22" width="170" height="38" rx="19" fill="#3E2723" stroke="#C59B27" stroke-width="3"/>
      <text x="0" y="4" fill="#FAF6F0" font-size="16" font-weight="800">WC • TENGAH</text>
