    <g transform="translate(865, 3260)">
      <rect x="-195" y="-28" width="390" height="52" rx="12" fill="#5C3A21" fill-opacity="0.92" stroke="#FAF6F0" stroke-width="2"/>
      <text x="0" y="-3" fill="#FAF6F0" font-size="20" letter-spacing="1">PENDOPO KABUPATEN (1780)</text>
      <text x="0" y="17" fill="#F3EDE2" font-size="14" font-weight="600">LONCENG BATAVIA 1774 &amp; SITUS BADAK PUTIH</text>
