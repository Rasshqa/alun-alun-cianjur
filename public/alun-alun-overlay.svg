    <circle cx="885" cy="2085" r="26" fill="#1E5631" stroke="#C59B27" stroke-width="4"/>
    <circle cx="735" cy="2435" r="26" fill="#1E5631" stroke="#C59B27" stroke-width="4"/>
  </g>

  <!-- 5B. Pendopo Kabupaten Cianjur (1780) & Lonceng Batavia (1774) - OSM WAY 1131909298 -->
  <g filter="url(#softShadow)">
    <polygon points="750.2,2975.7 621.4,3327.3 983.5,3471.1 1101.6,3106.2 750.2,2975.7" fill="#f3e3ce" stroke="#5C3A21" stroke-width="7" stroke-linejoin="round"/>
    <!-- Linggih Lonceng Batavia 1774 -->
    <circle cx="920" cy="2970" r="28" fill="#C59B27" stroke="#5C3A21" stroke-width="4"/>
  </g>

  <!-- 5C. Kantor Pos Cianjur (1880) - OSM WAY 476833765 -->
  <polygon points="257.4,2739.7 586.3,2897.2 405.3,3270.0 76.3,3112.5 257.4,2739.7" fill="#f5e6d3" stroke="#8B5A2B" stroke-width="5" stroke-linejoin="round"/>

  <!-- 5D. Vihara Bhumi Pharsjia / Hok Tek Bio (1880) - OSM WAY 476212879 -->
  <polygon points="2887.6,2687.4 2954.7,2714.1 2925.8,2785.4 2858.7,2758.6 2887.6,2687.4" fill="#fbe4d8" stroke="#9E2A2B" stroke-width="5" stroke-linejoin="round"/>

  <!-- 6. VEGETASI & POHON PENEDUH TAMAN ALUN-ALUN -->
  <g fill="#2d7a46" fill-opacity="0.55" stroke="#1E5631" stroke-width="2">
    <circle cx="2060" cy="960" r="32"/>
    <circle cx="2120" cy="760" r="28"/>
    <circle cx="2220" cy="520" r="34"/>
    <circle cx="2680" cy="580" r="32"/>
    <circle cx="2610" cy="840" r="30"/>
    <circle cx="2530" cy="1080" r="34"/>
    <circle cx="1950" cy="1550" r="36"/>
    <circle cx="1790" cy="1850" r="32"/>
    <circle cx="2720" cy="1760" r="34"/>
    <circle cx="2420" cy="2210" r="34"/>
    <circle cx="1710" cy="2560" r="32"/>
    <circle cx="1560" cy="2880" r="30"/>
    <circle cx="960" cy="2620" r="28"/>
  </g>

  <!-- 7. LABEL ARSITEKTURAL & NAMA JALAN ( KONTRAS TINGGI & MUDAH DIBACA ) -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="middle">
    <!-- Label Jalan Utama -->
    <g transform="translate(2480, 175) rotate(13)">
      <rect x="-250" y="-26" width="500" height="44" rx="22" fill="#2A1B12" fill-opacity="0.88"/>
      <text x="0" y="4" fill="#FAF6F0" font-size="24" letter-spacing="2">JL. SUROSO (GERBANG UTAMA)</text>
    </g>
    <g transform="translate(1280, 3045) rotate(20)">
      <rect x="-210" y="-24" width="420" height="42" rx="21" fill="#2A1B12" fill-opacity="0.88"/>
      <text x="0" y="4" fill="#FAF6F0" font-size="23" letter-spacing="2">JL. SITI JENAB</text>
    </g>
    <g transform="translate(790, 1810) rotate(21)">
      <rect x="-210" y="-22" width="420" height="38" rx="19" fill="#2A1B12" fill-opacity="0.82"/>
      <text x="0" y="4" fill="#FAF6F0" font-size="20" letter-spacing="1.5">JL. NYI R. SITI BODEDAR</text>
    </g>
    <g transform="translate(2970, 2320) rotate(-63)">
      <rect x="-260" y="-22" width="520" height="40" rx="20" fill="#2A1B12" fill-opacity="0.85"/>
      <text x="0" y="4" fill="#FAF6F0" font-size="20" letter-spacing="1.5">JL. MANGUNSARKORO (BOMERO)</text>
    </g>

    <!-- Label Zona Utama Taman Alun-Alun & Alun-Alun -->
    <g transform="translate(2320, 950)">
      <rect x="-270" y="-36" width="540" height="66" rx="14" fill="#1E5631" fill-opacity="0.92" stroke="#FAF6F0" stroke-width="3"/>
      <text x="0" y="-6" fill="#FAF6F0" font-size="25" letter-spacing="1.5">TAMAN ALUN-ALUN CIANJUR</text>
      <text x="0" y="20" fill="#e2f0cb" font-size="17" font-weight="600">ZONA UTARA • MENARA PANDANG &amp; KOLOSEUM MAENPO</text>
    </g>

    <g transform="translate(2310, 1690)">
