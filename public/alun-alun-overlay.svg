  <circle cx="2180" cy="1830" r="125" fill="#e9f5ec" stroke="#1E5631" stroke-width="4"/>
  <circle cx="2180" cy="1830" r="78" fill="#fdfaf5" stroke="#C59B27" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- Leuit (Lumbung Padi) & Patung Ayam Pelung -->
  <g transform="translate(2580, 1970) rotate(22)">
    <rect x="-70" y="-55" width="140" height="110" rx="14" fill="#f3e1c7" stroke="#5C3A21" stroke-width="4"/>
    <polygon points="-55,-35 55,-35 40,35 -40,35" fill="#8B5A2B" fill-opacity="0.85" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- 3E. Koridor Tengah-Utara Taman Alun-Alun: Tribun Koloseum & Patung Pesilat Maenpo (ICN-05) -->
  <g transform="translate(2250, 1200)">
    <circle cx="0" cy="0" r="155" fill="#f5ebe0" stroke="#5C3A21" stroke-width="5"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#8B5A2B" stroke-width="8" stroke-dasharray="28 12"/>
    <circle cx="0" cy="0" r="68" fill="#dff0d8" stroke="#1E5631" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="22" fill="#C59B27" stroke="#fff" stroke-width="2.5"/>
  </g>

  <!-- 3F. Koridor Utara Taman Alun-Alun: Menara Pandang (ICN-06) & Plaza Gerbang Utama Jl. Suroso -->
  <g transform="translate(2450, 670)">
    <rect x="-62" y="-62" width="124" height="124" rx="18" fill="#f3e1c7" stroke="#5C3A21" stroke-width="4"/>
    <circle cx="0" cy="0" r="36" fill="#8B5A2B" stroke="#fff" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#C59B27"/>
  </g>
  <!-- Plaza Gerbang Utama Jalan Suroso -->
  <polygon points="2206.7,205.6 2897.0,370.7 2835,510 2165,350"
           fill="#efe2d0" stroke="#1E5631" stroke-width="4"/>

  <!-- 4. JALUR PEDESTRIAN INTERNAL TAMAN ALUN-ALUN (EXACT OSM WAYS 1083459370 & 905672623 + PENGHUBUNG) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Jalur Pedestrian Barat Taman (OSM WAY 1083459370) -->
    <polyline points="1608.0,2052.7 1889.7,1259.4 2133.7,408.5 2205.1,141.6" stroke="#5C3A21" stroke-width="26" stroke-opacity="0.35"/>
    <polyline points="1608.0,2052.7 1889.7,1259.4 2133.7,408.5 2205.1,141.6" stroke="#fffaf3" stroke-width="18" stroke-dasharray="18 8"/>
    <!-- Jalur Pedestrian Timur Taman (OSM WAY 905672623) -->
    <polyline points="2868.0,311.7 2784.2,542.3 2694.3,749.4 2554.8,1135.6 2498.5,1343.3 2490.5,1465.8 2514.6,1549.7 2621.9,1729.5 2675.5,1921.2 2624.6,2147.6 2523.1,2365.3" stroke="#5C3A21" stroke-width="26" stroke-opacity="0.35"/>
    <polyline points="2868.0,311.7 2784.2,542.3 2694.3,749.4 2554.8,1135.6 2498.5,1343.3 2490.5,1465.8 2514.6,1549.7 2621.9,1729.5 2675.5,1921.2 2624.6,2147.6 2523.1,2365.3" stroke="#fffaf3" stroke-width="18" stroke-dasharray="18 8"/>
    <!-- Jalur Sirkulasi Internal Penghubung Alun-Alun Selatan ke Taman Alun-Alun -->
    <polyline points="950,2830 1380,2570 1450,2100 2180,1830 2580,1970"
              stroke="#8B5A2B" stroke-width="14" stroke-dasharray="12 10" stroke-opacity="0.55"/>
    <polyline points="1080,2370 1450,2100 2250,1200 2450,670 2540,290"
              stroke="#1E5631" stroke-width="14" stroke-dasharray="12 10" stroke-opacity="0.55"/>
  </g>

  <!-- 5. BANGUNAN CAGAR BUDAYA & IKON UTAMA SEKITAR (EXACT OSM POLYGONS) -->
  <!-- 5A. Masjid Agung Cianjur (1810) - OSM WAY 497038979 -->
  <g filter="url(#softShadow)">
    <polygon points="393.3,2344.9 581.7,1900.6 959.2,2058.4 770.8,2502.7 393.3,2344.9" fill="#e6f4ea" stroke="#1E5631" stroke-width="8" stroke-linejoin="round"/>
