      <text x="0" y="-5" fill="#FAF6F0" font-size="23" letter-spacing="1">ZONA MAMAOS &amp; SAYAP TIMUR</text>
      <text x="0" y="19" fill="#F3EDE2" font-size="16" font-weight="600">PANGGUNG SULING KECAPI • LEUIT &amp; AYAM PELUNG</text>
    </g>

    <g transform="translate(1380, 2470)">
      <rect x="-245" y="-34" width="490" height="62" rx="14" fill="#1E5631" fill-opacity="0.90" stroke="#FAF6F0" stroke-width="2.5"/>
      <text x="0" y="-5" fill="#FAF6F0" font-size="23" letter-spacing="1">LAPANGAN ALUN-ALUN CIANJUR</text>
      <text x="0" y="19" fill="#e2f0cb" font-size="16" font-weight="600">RUMPUT SINTETIS • TAMAN ANAK • LORONG 99 TIANG</text>
    </g>

    <g transform="translate(650, 2200)">
      <rect x="-175" y="-30" width="350" height="56" rx="12" fill="#1E5631" fill-opacity="0.94" stroke="#C59B27" stroke-width="3"/>
      <text x="0" y="-4" fill="#FAF6F0" font-size="21" letter-spacing="1">MASJID AGUNG CIANJUR</text>
      <text x="0" y="18" fill="#f6e3ba" font-size="15" font-weight="600">BERDIRI 1810 • WAKAF NYI R. SITI BODEDAR</text>
