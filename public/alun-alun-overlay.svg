    <g transform="translate(2078, 2000)">
      <rect x="-95" y="-22" width="190" height="38" rx="19" fill="#3E2723" stroke="#C59B27" stroke-width="3"/>
      <text x="0" y="4" fill="#FAF6F0" font-size="16" font-weight="800">WC • ZONA MAMAOS</text>
