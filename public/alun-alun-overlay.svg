<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3400 3600" width="3400" height="3600">
  <defs>
    <pattern id="grassPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#dff0d8" fill-opacity="0.88"/>
      <circle cx="10" cy="10" r="1.8" fill="#1E5631" fill-opacity="0.22"/>
      <circle cx="30" cy="30" r="1.8" fill="#1E5631" fill-opacity="0.22"/>
    </pattern>
    <pattern id="synthTurf" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <rect width="30" height="30" fill="#b8e2c4" fill-opacity="0.92"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#1E5631" stroke-width="4" stroke-opacity="0.12"/>
    </pattern>
    <pattern id="pavingPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#f5ede2" fill-opacity="0.92"/>
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#8B5A2B" stroke-width="0.9" stroke-opacity="0.22"/>
    </pattern>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2A1B12" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 1. JARINGAN JALAN PERIMETER (OSM EXACT WAYS) -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Jalan Suroso (Utara Taman Alun-Alun) -->
    <polyline points="3873.7,564.4 3191.8,388.5 2967.9,333.9 2868.0,311.7 2402.8,191.7 2290.7,162.8 2205.1,141.6 2169.6,134.3" stroke="#78685a" stroke-width="58" stroke-opacity="0.45"/>
    <polyline points="3873.7,564.4 3191.8,388.5 2967.9,333.9 2868.0,311.7 2402.8,191.7 2290.7,162.8 2205.1,141.6 2169.6,134.3" stroke="#fffdf9" stroke-width="44" stroke-opacity="0.85"/>
    <!-- Jalan Siti Jenab (Selatan Alun-Alun & Depan Pendopo) -->
    <polyline points="3873.7,564.4 3694.6,1052.1 3579.3,1365.8 3532.4,1493.5 3389.6,1825.8 3099.8,2553.7 2748.6,3488.3 2446.1,4307.5 2186.4,4992.5 2112.8,5178.3 2062.4,5320.5 2059.1,5327.0 1908.9,5723.7 1789.6,6035.7 1726.7,6184.4 1691.9,6243.6 1576.5,6384.8 1477.9,6462.0" stroke="#78685a" stroke-width="64" stroke-opacity="0.45"/>
    <polyline points="3873.7,564.4 3694.6,1052.1 3579.3,1365.8 3532.4,1493.5 3389.6,1825.8 3099.8,2553.7 2748.6,3488.3 2446.1,4307.5 2186.4,4992.5 2112.8,5178.3 2062.4,5320.5 2059.1,5327.0 1908.9,5723.7 1789.6,6035.7 1726.7,6184.4 1691.9,6243.6 1576.5,6384.8 1477.9,6462.0" stroke="#fffdf9" stroke-width="50" stroke-opacity="0.85"/>
    <!-- Jalan Mangunsarkoro & Bomero City Walk (Timur/Tenggara) -->
    <polyline points="1165.2,1885.7 781.8,2817.8" stroke="#78685a" stroke-width="56" stroke-opacity="0.45"/>
    <polyline points="1165.2,1885.7 781.8,2817.8" stroke="#f7efe4" stroke-width="42" stroke-opacity="0.88"/>
    <!-- Jalan Nyi R. Siti Bodedar & Akses Utara Masjid Agung -->
    <polyline points="1957.5,2179.7 1608.0,2052.7 1313.1,1941.5 1278.1,1928.3 1214.4,1904.3 1165.2,1885.7 805.1,1762.1" stroke="#78685a" stroke-width="46" stroke-opacity="0.40"/>
    <polyline points="1957.5,2179.7 1608.0,2052.7 1313.1,1941.5 1278.1,1928.3 1214.4,1904.3 1165.2,1885.7 805.1,1762.1" stroke="#fffdf9" stroke-width="34" stroke-opacity="0.85"/>
    <!-- Jalan Acep Hanafi -->
    <polyline points="1957.5,2179.7 2523.1,2365.3" stroke="#78685a" stroke-width="38" stroke-opacity="0.38"/>
    <polyline points="1957.5,2179.7 2523.1,2365.3" stroke="#fffdf9" stroke-width="26" stroke-opacity="0.82"/>
    <polyline points="2523.1,2365.3 2569.7,2380.4 3003.3,2521.5" stroke="#78685a" stroke-width="38" stroke-opacity="0.38"/>
    <polyline points="2523.1,2365.3 2569.7,2380.4 3003.3,2521.5" stroke="#fffdf9" stroke-width="26" stroke-opacity="0.82"/>
  </g>

  <!-- 2. POLIGON UTAMA TAMAN ALUN-ALUN & ALUN-ALUN CIANJUR (OSM WAY 692591214 + PELATARAN MASJID) -->
  <g filter="url(#softShadow)">
    <!-- Pelataran Penghubung Masjid Agung & Alun-Alun -->
    <polygon points="581.7,1900.6 1191.1,1929.0 835.2,2787.6 393.3,2344.9"
             fill="url(#pavingPattern)" stroke="#8B5A2B" stroke-width="6" stroke-opacity="0.65"/>

    <!-- Poligon Resmi OSM WAY 692591214: Taman Alun-Alun Cianjur (Meliputi Alun-Alun Selatan, Sayap Timur, & Taman Utara s/d Jl. Suroso) -->
    <polygon points="835.2,2787.6 1595.8,3065.7 1925.6,2156.2 2556.8,2380.6 2905.8,1683.3 2507.5,1479.3 2897.0,370.7 2206.7,205.6 1923.6,1294.8 1647.0,2099.8 1191.1,1929.0 835.2,2787.6"
             fill="url(#grassPattern)" stroke="#1E5631" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- 3. SUB-ZONA ARSITEKTURAL DI DALAM ALUN-ALUN & TAMAN ALUN-ALUN -->
  <!-- 3A. Zona Selatan: Hamparan Rumput Sintetis & Taman Bermain Anak (ICN-07) -->
  <polygon points="915,2740 1555,2975 1825,2235 1185,2005"
           fill="url(#synthTurf)" stroke="#1E5631" stroke-width="5" stroke-dasharray="16 8"/>
  <!-- Lapangan Inti Rumput Sintetis -->
  <polygon points="1030,2680 1490,2850 1690,2310 1230,2140"
           fill="#99d5aa" fill-opacity="0.65" stroke="#1E5631" stroke-width="3"/>
  <!-- Area Playground Anak & Jalur Refleksi Kerikil -->
  <rect x="1330" y="2660" width="210" height="110" rx="22" transform="rotate(20 1435 2715)"
        fill="#f6e3ba" stroke="#8B5A2B" stroke-width="3"/>

  <!-- 3B. Lorong 99 Tiang Asmaul Husna (ICN-02) -->
  <g>
    <polygon points="1165,1965 1865,2220 1915,2090 1215,1835"
             fill="#fdfaf5" stroke="#8B5A2B" stroke-width="4"/>
    <!-- Deretan Pilar Simbolis 99 Tiang Asmaul Husna -->
    <line x1="1200" y1="1950" x2="1850" y2="2190" stroke="#C59B27" stroke-width="8" stroke-dasharray="10 18" stroke-linecap="round"/>
    <line x1="1230" y1="1870" x2="1880" y2="2110" stroke="#C59B27" stroke-width="8" stroke-dasharray="10 18" stroke-linecap="round"/>
  </g>

  <!-- 3C. Monumen Al-Qur'an Raksasa & Kolam Perahu (ICN-01) -->
  <g transform="translate(1080, 2370) rotate(21)">
    <!-- Kolam Perahu -->
    <path d="M -95,0 Q 0,-58 95,0 Q 0,58 -95,0 Z" fill="#8ecae6" stroke="#1E5631" stroke-width="4"/>
    <!-- Pedestal & Monumen Al-Qur'an Emas -->
    <rect x="-26" y="-20" width="52" height="40" rx="8" fill="#5C3A21" stroke="#fff" stroke-width="2"/>
    <rect x="-18" y="-13" width="36" height="26" rx="4" fill="#C59B27"/>
  </g>

  <!-- 3D. Zona Tengah & Sayap Timur Taman Alun-Alun: Panggung Suling & Kecapi (ICN-03) + Leuit & Ayam Pelung (ICN-04) -->
  <polygon points="1895,2130 2535,2350 2865,1695 2475,1500 1675,2050"
           fill="url(#pavingPattern)" fill-opacity="0.78" stroke="#8B5A2B" stroke-width="3.5"/>
